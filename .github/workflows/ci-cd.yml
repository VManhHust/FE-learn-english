name: FE and CMS UI CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FE_IMAGE_NAME: ghcr.io/vmanhhust/fe-learn-english
  CMS_UI_IMAGE_NAME: ghcr.io/vmanhhust/cms-ui-learn-english
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
  NEXT_PUBLIC_CMS_API_URL: ${{ vars.NEXT_PUBLIC_CMS_API_URL || '/cms-api' }}
  NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
  VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build Next.js frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  cms-ui:
    name: Build CMS UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build CMS UI
        run: npm run build

  images:
    name: Build application images
    needs: [frontend, cms-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FE_IMAGE_NAME }}:latest
            ${{ env.FE_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CMS_API_URL=${{ env.NEXT_PUBLIC_CMS_API_URL }}
            NEXT_PUBLIC_GTM_ID=${{ env.NEXT_PUBLIC_GTM_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and optionally push CMS UI image
        uses: docker/build-push-action@v7
        with:
          context: ./cms
          file: ./cms/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.CMS_UI_IMAGE_NAME }}:latest
            ${{ env.CMS_UI_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha,scope=cms-ui
          cache-to: type=gha,mode=max,scope=cms-ui

  deploy:
    name: Deploy FE and CMS UI
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-fe-production
      cancel-in-progress: true
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy frontend services
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "cd /opt/learn-english && docker compose pull frontend cms-ui && docker compose up -d --no-deps frontend cms-ui"
